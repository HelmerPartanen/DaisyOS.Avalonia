name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore

      - name: Build Debug
        run: dotnet build --configuration Debug --no-restore

      - name: Test Debug
        run: dotnet test --configuration Debug --no-build

      - name: Build Release
        run: dotnet build --configuration Release --no-restore

      - name: Test Release
        run: dotnet test --configuration Release --no-build

      - name: Verify formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Test release scripts
        run: scripts/test-release-scripts.sh

      - name: Validate desktop packaging
        run: scripts/check-packaging.sh

      - name: Validate DaisyOS branding
        run: scripts/check-branding.sh

      - name: Test live-session recovery
        run: scripts/test-session-scripts.sh

      - name: Test development display-manager session
        run: scripts/test-development-session-install.sh

      - name: Validate KWin prototype
        run: scripts/check-kwin-prototype.sh

      - name: Test compositor session preflight
        run: scripts/test-compositor-session-check.sh

      - name: Check shell scripts
        uses: ludeeus/action-shellcheck@v2
        with:
          scandir: scripts

  nightly:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Build nightly artifact
        run: scripts/build-release.sh --channel nightly

      - name: Upload nightly artifact
        uses: actions/upload-artifact@v4
        with:
          name: DaisyOS-Shell-nightly-linux-x64
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 14
