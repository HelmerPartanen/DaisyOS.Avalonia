DEFAULT daisyos
PROMPT 0
TIMEOUT 10

UI vesamenu.c32
MENU TITLE DaisyOS Live
MENU HIDDEN

LABEL daisyos
  MENU LABEL Start DaisyOS Live
  LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
  INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
  APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% console=tty1 console=ttyS0,115200n8

LABEL reboot
  MENU LABEL Restart
  COM32 reboot.c32

LABEL poweroff
  MENU LABEL Shut down
  COM32 poweroff.c32
